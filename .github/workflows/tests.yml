name: Evidence and safety tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt
      - name: Run tests
        env:
          EVIDENCE_INVESTIGATOR_ADAPTER: tests/adapter.py
        run: python -m pytest -q
      - name: Run offline demo
        run: python -m incident_investigator --case fixtures/checkout_throttling --mode offline --output /tmp/incident-brief.md
