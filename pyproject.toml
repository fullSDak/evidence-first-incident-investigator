[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-incident-investigator"
version = "0.1.0"
description = "Reproducible, evidence-first investigation of fictional store incidents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
incident-investigator = "incident_investigator.cli:main"

[tool.setuptools.packages.find]
include = ["incident_investigator*"]
